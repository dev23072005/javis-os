name: Build pinned staging 0.102.0

on:
  push:
    branches:
      - ci/staging-build-0.102.0-6a0f229d
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-image-6a0f229d
  cancel-in-progress: false

jobs:
  build-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6a0f229d5f4d639257bb98bd06371e13382b8ec0
          fetch-depth: 1
      - name: Verify frozen source
        run: |
          test "$(git rev-parse HEAD)" = "6a0f229d5f4d639257bb98bd06371e13382b8ec0"
          test "$(git rev-parse HEAD^{tree})" = "93dac64ddd39f64f8e004eb8d75774034e05a8e2"
          test "$(cat VERSION)" = "0.102.100"
          test -z "$(git status --porcelain)"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build staging tag only
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/dev23072005/javis-os:staging-6a0f229d5f4d639257bb98bd06371e13382b8ec0
          labels: |
            org.opencontainers.image.revision=6a0f229d5f4d639257bb98bd06371e13382b8ec0
            org.opencontainers.image.version=0.102.100
            org.opencontainers.image.source=https://github.com/dev23072005/javis-os
            io.afftera.staging.tree=93dac64ddd39f64f8e004eb8d75774034e05a8e2
          build-args: |
            CLAUDE_CLI_VERSION=2.1.293
            CODEX_CLI_VERSION=0.161.0
            WITH_BROWSER_DEPS=1
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=staging-upstream-01020
      - name: Record immutable image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          BUILD_WORKFLOW_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          receipt = {
              "source_commit": "6a0f229d5f4d639257bb98bd06371e13382b8ec0",
              "source_tree": "93dac64ddd39f64f8e004eb8d75774034e05a8e2",
              "version": "0.102.100",
              "image_tag": "ghcr.io/dev23072005/javis-os:staging-6a0f229d5f4d639257bb98bd06371e13382b8ec0",
              "image_digest": os.environ["IMAGE_DIGEST"],
              "workflow_commit": os.environ["BUILD_WORKFLOW_SHA"],
              "run_id": os.environ["BUILD_RUN_ID"],
              "claude_cli": "2.1.293",
              "codex_cli": "0.161.0",
              "latest_tag_modified": False,
              "production_tag_modified": False,
              "production_promoted": False,
          }
          assert receipt["image_digest"].startswith("sha256:")
          with open("staging-image-receipt.json", "w") as stream:
              json.dump(receipt, stream, indent=2)
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: staging-image-receipt-6a0f229d
          path: staging-image-receipt.json
          retention-days: 30
